# Same checks as scripts/check.sh — if they disagree, that's a harness bug. CI is authoritative.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for every job: checkout only. upload-artifact uses the runtime
# token, not GITHUB_TOKEN. Widen per job, never here.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6 # reads global.json
      - run: dotnet format backend/R8er.slnx --verify-no-changes
      - run: dotnet test backend/R8er.slnx --nologo
      - run: docker compose config --quiet && docker compose --profile relay config --quiet

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
      - run: test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }
        working-directory: agent
      - run: go vet ./... && go build ./... && go test ./...
        working-directory: agent

  # The one golden path (dev-env spec). Containers via testcontainers-node,
  # backend/Vite/agent as real processes — see e2e/global-setup.ts.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chrome
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            e2e/logs/
            e2e/test-results/
            e2e/playwright-report/
